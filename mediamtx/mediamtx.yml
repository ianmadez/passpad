# MediaMTX for PassPad (Windows host). The patched chiaki-ng publishes the PS5's own H.264 + Opus
# over loopback RTSP (path "console"); browsers watch over WebRTC, but signaling only goes through
# the PassPad server (/api/video), which checks who is asking. START-PassPad.cmd sets the Tailscale
# address and the publisher password through MTX_* environment variables.
# warn, not info: info logs every viewer's IP address.
logLevel: warn

# Packets queued per reader before dropping (default 512, ~0.4 s at 1080p if the writer ever stalls).
# 256 still fits a whole 1080p keyframe burst, so recovery frames are never the ones dropped, while
# capping how much stale video can pile up.
writeQueueSize: 256

authMethod: internal
authInternalUsers:
  # Only this laptop may read the video (the PassPad server proxies it to friends).
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: read
        path: console
  # Publishing and the control API need this password, so no other program on the laptop can
  # replace the video. The hash matches nothing: the starter sets the real one through
  # MTX_AUTHINTERNALUSERS_1_PASS (keep this entry second).
  - user: passpad-api
    pass: sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: publish
        path: console

api: true
apiAddress: 127.0.0.1:9997
apiAllowOrigins: []

rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtspEncryption: 'no'

# Unused protocols stay off: less memory, no extra open ports.
rtmp: false
hls: false
srt: false
moq: false
playback: false

webrtc: true
# Signaling on loopback only; the PassPad server relays it.
webrtcAddress: 127.0.0.1:8889
# One UDP port for all media. The Windows firewall rule only lets Tailscale peers reach it.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
# Offer only the Tailscale address (set by the starter) and loopback: no LAN or public candidates,
# no STUN, so ICE never wanders off the tailnet.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []

paths:
  console: {}
