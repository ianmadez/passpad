# Builds the Windows release: chiaki-ng with PassPad's patches (AGPL-3.0, chiaki/) and the
# PassPad package that START-PassPad.cmd downloads/updates from. Push a tag like v0.2.0 to publish.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CHIAKI_REPO: streetpea/chiaki-ng
  # Keep in sync with the commit the patches in chiaki/ were made against.
  CHIAKI_COMMIT: 43728af2e639fecb8a7af1cd68c29820a40de973
  LIBPLACEBO_VERSION: 3be579e6c7f6b421d9ac3ab4860edc437c50b3eb

jobs:
  chiaki:
    name: chiaki-ng (Windows x64, patched)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No CRLF conversion (patches must apply byte for byte)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          path: passpad
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CHIAKI_REPO }}
          ref: ${{ env.CHIAKI_COMMIT }}
          path: chiaki-ng
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils make unzip zip
          pacboy: >-
            ca-certificates:p cc:p cmake:p curl:p fast_float:p fftw:p json-c:p libevent:p lcms2:p
            libdovi:p meson:p miniupnpc:p gcc:p nasm:p ninja:p openssl:p opus:p pkgconf:p protobuf:p
            python:p python-psutil:p python-glad:p python-jinja:p python-pip:p qt6-base:p
            qt6-declarative:p qt6-svg:p shaderc:p speexdsp:p spirv-cross:p vulkan:p vulkan-headers:p
      - name: Apply PassPad patches
        working-directory: chiaki-ng
        run: |
          for p in ../passpad/chiaki/net-input.patch ../passpad/chiaki/stream-out.patch; do
            git apply --check "$p" && git apply "$p"
          done
      - name: Dependencies (as upstream's MSYS2 build)
        working-directory: chiaki-ng
        run: |
          pip install protobuf
          scripts/build-libplacebo-windows.sh
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip -q ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/. /mingw64/bin
          cp -a ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/. /mingw64/include
          cp -a ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/. /mingw64/lib
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc
      - name: Build
        working-directory: chiaki-ng
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF
          cmake --build build --config Release --target chiaki
      - name: Package
        working-directory: chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "$PWD/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
          cp ../passpad/chiaki/LICENSE ../passpad/chiaki/NOTICE chiaki-ng-Win/
          (cd chiaki-ng-Win && zip -qr ../chiaki-ng-passpad-win64.zip .)
          sha256sum chiaki-ng-passpad-win64.zip | cut -d' ' -f1 > chiaki-ng-passpad-win64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chiaki
          path: chiaki-ng/chiaki-ng-passpad-win64.zip*
          if-no-files-found: error

  package:
    name: PassPad package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: passpad
      - name: Zip what the host laptop needs (no dev tooling, no secrets)
        working-directory: passpad
        run: |
          zip -qr ../passpad-windows.zip START-PassPad.cmd JOIN-PassPad.cmd README.md LICENSE THIRD_PARTY_NOTICES.md \
            SETUP-GUIDE.md CHANGELOG.md package.json bun.lock tsconfig.json src public scripts/start-host.ps1 scripts/join.ps1 mediamtx chiaki
          cd .. && sha256sum passpad-windows.zip | cut -d' ' -f1 > passpad-windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: passpad-windows.zip*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chiaki, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: passpad
      - name: Patch notes for this version (its section of CHANGELOG.md)
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '$1=="##" && ($2==tag || $2==tag":") {on=1; next} $1=="##" {on=0} on' passpad/CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: PassPad ${{ github.ref_name }}
          body_path: notes.md
          files: |
            chiaki-ng-passpad-win64.zip
            chiaki-ng-passpad-win64.zip.sha256
            passpad-windows.zip
            passpad-windows.zip.sha256
